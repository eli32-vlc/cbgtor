# Tor hidden service server block - only accessible via Tor
# Listen on localhost:8080 (as configured in torrc HiddenServicePort)
server {
    listen 127.0.0.1:8080;
    server_name _;

    # Include security headers
    include /etc/nginx/includes/headers.conf;

    # Health check for Tor access
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Main reverse proxy - all Tor traffic goes to target
    location / {
        limit_req zone=proxy burst=100 nodelay;
        limit_conn conn_limit 50;

        include /etc/nginx/includes/headers.conf;
        include /etc/nginx/includes/proxy.conf;

        # Use environment variable for target URL
        proxy_pass __TARGET_URL__;
    }
}
