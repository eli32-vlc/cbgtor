# Public-facing HTTP server - serves simple page and proxy endpoint
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit 10;

    # Include security headers
    include /etc/nginx/includes/headers.conf;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy endpoint (rate limited more generously)
    location /proxy/ {
        limit_req zone=proxy burst=50 nodelay;

        include /etc/nginx/includes/headers.conf;
        include /etc/nginx/includes/proxy.conf;

        proxy_pass __TARGET_URL__/;
    }
}

# Public-facing HTTPS server
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    root /var/www/html;
    index index.html;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn conn_limit 10;

    # Include security headers
    include /etc/nginx/includes/headers.conf;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reverse proxy endpoint (rate limited more generously)
    location /proxy/ {
        limit_req zone=proxy burst=50 nodelay;

        include /etc/nginx/includes/headers.conf;
        include /etc/nginx/includes/proxy.conf;

        proxy_pass __TARGET_URL__/;
    }
}
