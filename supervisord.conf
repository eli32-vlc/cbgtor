[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid

[program:tor]
command=/usr/bin/tor -f /etc/tor/torrc
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/var/log/supervisor/tor-stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/tor-stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
exitcodes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
exitcodes=0
depends_on=tor

[program:setup]
command=/app/start.sh
autostart=true
autorestart=false
startsecs=0
startretries=1
priority=10
stdout_logfile=/var/log/supervisor/setup-stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/setup-stderr.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
depends_on=tor,nginx
